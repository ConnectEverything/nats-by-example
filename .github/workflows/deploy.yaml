name: deploy
on:
  pull_request:
    types: [opened, synchronize, edited, reopened]
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  run:
    name: Deploy
    runs-on: "ubuntu-latest"

    permissions:
      contents: write
      issues: write
      pull-requests: write
      statuses: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.x"

      - name: Install Asciinema
        run: |
          python3 -m pip install asciinema

      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.21"
          cache-dependency-path: cmd/nbe/go.sum

      - name: Test nbe
        run: |
          go test -v -race ./cmd/nbe

      - name: Build nbe
        run: |
          go install ./cmd/nbe

      - name: Generate recordings
        shell: 'script -q -e -c "bash {0}"'
        run: |
          nbe generate recording --exit-on-error

      - name: Auto-commit generated recordings
        uses: stefanzweifel/git-auto-commit-action@v5
        if: ${{ github.ref_name == 'main' }}
        with:
          commit_message: Auto-commit recording
          file_pattern: examples/**/output.txt examples/**/output.cast

      - name: Build HTML
        run: |
          nbe build

      - name: Vercel deploy
        id: vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            DEPLOY_URL=$(npx vercel deploy ./html --token="$VERCEL_TOKEN" --prod --yes)
          else
            DEPLOY_URL=$(npx vercel deploy ./html --token="$VERCEL_TOKEN" --yes)
          fi
          echo "url=$DEPLOY_URL" >> "$GITHUB_OUTPUT"

      - name: Comment preview URL on PR
        if: ${{ github.event_name == 'pull_request' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr comment ${{ github.event.pull_request.number }} \
            --body "**Vercel Preview:** ${{ steps.vercel.outputs.url }}" \
            --repo ${{ github.repository }}
