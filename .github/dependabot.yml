# Monthly dependency update PRs for every ecosystem the examples use. Each PR
# triggers the verify-examples workflow for the affected languages, so a bump
# that breaks an example fails its check instead of landing silently.
#
# Minor/patch bumps are grouped into one PR per ecosystem. Major bumps arrive
# as individual PRs because they usually need example code changes (see
# .claude/skills/upgrade-examples/SKILL.md).
#
# Not covered (no Dependabot ecosystem): Crystal (docker/crystal/shard.yml),
# Elixir (Mix.install in each main.exs), Deno URL imports in examples/**/deno,
# the C client (docker/c/install-nats-c.sh) and the nats-server/natscli/nsc
# versions installed with `go install` in Dockerfiles. Those are upgraded with
# the upgrade-examples skill.
version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    groups:
      actions: { patterns: ["*"] }

  - package-ecosystem: gomod
    directories:
      - /cmd/nbe
      - /docker/go
      - /examples/**/go
      - /examples/**/cli/service
      - /examples/**/cli/client
      - /examples/**/cli/generate-stan-data
    schedule: { interval: monthly }
    groups:
      go: { update-types: [minor, patch] }

  - package-ecosystem: docker
    directories:
      - /docker/*
      - /examples/**
    schedule: { interval: monthly }
    groups:
      docker-images: { update-types: [minor, patch] }

  - package-ecosystem: docker-compose
    directory: /docker
    schedule: { interval: monthly }

  - package-ecosystem: npm
    directory: /docker/node
    schedule: { interval: monthly }
    groups:
      node: { update-types: [minor, patch] }

  - package-ecosystem: pip
    directory: /docker/python
    schedule: { interval: monthly }
    groups:
      python: { update-types: [minor, patch] }

  - package-ecosystem: cargo
    directory: /docker/rust
    schedule: { interval: monthly }
    groups:
      rust: { update-types: [minor, patch] }

  - package-ecosystem: gradle
    directory: /docker/java
    schedule: { interval: monthly }
    groups:
      java: { update-types: [minor, patch] }

  - package-ecosystem: nuget
    directories:
      - /docker/dotnet
      - /examples/**/csharp
    schedule: { interval: monthly }
    groups:
      dotnet: { update-types: [minor, patch] }
