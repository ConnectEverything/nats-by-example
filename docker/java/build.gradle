plugins {
    id 'application'
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'io.nats.nkeys:lts-jdk25:3.0.6'
    implementation 'io.nats:jnats-json-jdk25:3.1.1'
    implementation 'io.nats:jwt-utils-jdk25:3.0.4'
    implementation 'io.nats:jnats:2.27.0'

    // JSON serialization/deserialization
    implementation 'tools.jackson.core:jackson-databind:3.3.0'
}

apply plugin: 'java'

task (uberJar, type:Jar) {
    archiveClassifier = 'uber'

    from sourceSets.main.output

    dependsOn configurations.runtimeClasspath
    from {
        configurations.runtimeClasspath.findAll { it.name.endsWith('jar') }.collect { zipTree(it) }
    }

    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    // Signatures of signed dependency jars don't match the merged jar and
    // make the JVM refuse to start it.
    exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA', 'META-INF/*.EC'
}
